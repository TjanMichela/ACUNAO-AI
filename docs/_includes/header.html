<div class="js-promo-color-modes-banner-profile isInitialToggle position-relative">
    <!-- Logo images for light and dark mode -->
    <img 
        src="/assets/images/logo-light.png" 
        alt="Logo" 
        class="logo-img logo-img-light" 
        style="display: none; width: 106px; height: 60px;"
    >
    <img 
        src="/assets/images/logo-dark.png" 
        alt="Logo" 
        class="logo-img logo-img-dark" 
        style="display: none; width: 106px; height: 60px;"
    >
    <span tabindex="0" aria-label="Toggle dark mode" aria-checked="true" role="checkbox"
          class="profile-color-modes-toggle js-promo-color-modes-toggle">
        <div class="profile-color-modes-toggle-track"></div>
        <div class="profile-color-modes-toggle-thumb">
          <svg style="fill: var(--color-profile-color-modes-toggle-moon); margin: 7px 0 0 7px;" aria-hidden="true"
               width="14" height="13" viewBox="0 0 14 13" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M4.52208 7.71754C7.5782 7.71754 10.0557 5.24006 10.0557 2.18394C10.0557 1.93498 10.0392 1.68986 10.0074 1.44961C9.95801 1.07727 10.3495 0.771159 10.6474 0.99992C12.1153 2.12716 13.0615 3.89999 13.0615 5.89383C13.0615 9.29958 10.3006 12.0605 6.89485 12.0605C3.95334 12.0605 1.49286 10.001 0.876728 7.24527C0.794841 6.87902 1.23668 6.65289 1.55321 6.85451C2.41106 7.40095 3.4296 7.71754 4.52208 7.71754Z"></path>
          </svg>
        </div>
      </span>
</div>
<script type="text/javascript">
    (function () {
        var KEY_MODE = 'markdown_only_dark_mode';

        function toggleMode() {
            var mode = document.documentElement.getAttribute('data-color-mode') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-color-mode', mode);
            localStorage.setItem(KEY_MODE, mode);
            updateLogo();
        }

        function updateLogo() {
            var mode = document.documentElement.getAttribute('data-color-mode');
            document.querySelector('.logo-img-light').style.display = (mode === 'light') ? 'block' : 'none';
            document.querySelector('.logo-img-dark').style.display = (mode === 'dark') ? 'block' : 'none';
        }

        // load from local storage
        var mode = localStorage.getItem(KEY_MODE);
        mode && document.documentElement.setAttribute('data-color-mode', mode);

        // init events
        document.querySelector('.profile-color-modes-toggle').onclick = toggleMode;

        // show correct logo on load
        updateLogo();
    })();
</script>
<style>
.logo-img-light { display: none; }
.logo-img-dark { display: none; }
[data-color-mode="light"] .logo-img-light { display: block !important; }
[data-color-mode="light"] .logo-img-dark { display: none !important; }
[data-color-mode="dark"] .logo-img-light { display: none !important; }
[data-color-mode="dark"] .logo-img-dark { display: block !important; }
</style>
