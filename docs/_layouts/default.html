<!DOCTYPE html>
<html lang="en-US" data-color-mode="{{ site.color-mode }}" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="{{ site.theme-color | default: '#1e2327' }}">

    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="alternate icon" class="js-site-favicon" type="image/png" href="https://github.githubassets.com/favicons/favicon.png">
    <link rel="icon" class="js-site-favicon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg">

    <style>
        nav {
            background-color: #24292f;
            padding: 0.5rem 1rem;
            margin-bottom: 2rem;
        }
        nav a {
            color: #ffffff;
            margin-right: 1.5rem;
            text-decoration: none;
            font-weight: 500;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/installation/' | relative_url }}">Installation</a>
        <a href="{{ '/download/' | relative_url }}">Donwnload</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
    <div class="container-lg px-3 my-5 markdown-body">
        {% include header.html %}
        {{ content }}
    </div>
    {% include footer.html %}
</body>
</html>
